<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login - King777</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/css/king777-glass.css?v=1" />
</head>
<body>
  <main class="wrap">
    <div class="brand">
      <div class="text-logo">KING777</div>
    </div>

    <section class="card">
      <div class="title-row">
        <div class="title-line"></div>
        <div class="title-text">Sign In</div>
        <div class="title-line"></div>
      </div>

      <form id="adminLoginForm" autocomplete="on">
        <input id="username" name="username" class="field" type="text" placeholder="Username" required />
        <input id="password" name="password" class="field" type="password" placeholder="Password" required />
        <button id="submitBtn" class="btn" type="submit">Login  <span aria-hidden="true">➜</span></button>
      </form>

      <div id="message" class="msg"></div>
    </section>
  </main>

  <script>
    (function () {
      var form = document.getElementById("adminLoginForm");
      var message = document.getElementById("message");
      var button = document.getElementById("submitBtn");

      function setMessage(text, ok) {
        message.textContent = text || "";
        message.className = ok ? "msg ok" : "msg";
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        setMessage("");
        button.disabled = true;
        button.textContent = "Logging in...";

        var username = document.getElementById("username").value.trim();
        var password = document.getElementById("password").value;

        try {
          var resp = await fetch("/api/login-admin", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: username, password: password, admin: true }),
          });
          var payload = await resp.json();
          if (!resp.ok || !payload || !payload.data || !payload.data.token) {
            throw new Error((payload && payload.message) || "Login failed");
          }

          localStorage.setItem("token-admin", payload.data.token);
          localStorage.setItem("refreshToken-admin", payload.data.refreshToken || "");
          localStorage.setItem("userType-admin", payload.data.role || "admin");
          localStorage.setItem("token", payload.data.token);
          localStorage.setItem("refreshToken", payload.data.refreshToken || "");
          localStorage.setItem("userType", payload.data.role || "admin");

          setMessage("Login successful. Redirecting...", true);
          window.location.href = "/admin";
        } catch (err) {
          setMessage(err && err.message ? err.message : "Invalid credentials");
          button.disabled = false;
          button.innerHTML = 'Login  <span aria-hidden="true">➜</span>';
        }
      });
    })();
  </script>
</body>
</html>
