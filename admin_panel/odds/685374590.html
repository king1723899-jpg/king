    (function () {
      // Mark admin routes so the stylesheet can tell the two apps apart, and
      // keep the title in sync while the single-page app navigates.
      var sync = function () {
        var admin = /(^|\/)admin(\/|$)/i.test(location.pathname || "");
        document.documentElement.setAttribute("data-app", admin ? "admin" : "player");
        document.title = "King777";
      };
      sync();
      ["pushState", "replaceState"].forEach(function (name) {
        var original = history[name];
        if (typeof original !== "function") return;
        history[name] = function () {
          var result = original.apply(this, arguments);
          requestAnimationFrame(sync);
          return result;
        };
      });
      window.addEventListener("popstate", sync);

      // Generic open/close for legacy [data-menu-toggle] / navbar togglers.
      var bindMenuToggle = function () {
        document.querySelectorAll("[data-menu-toggle], .navbar-toggler").forEach(function (button) {
          if (button.dataset.menuBound === "true") return;
          button.dataset.menuBound = "true";
          button.addEventListener("click", function (event) {
            event.preventDefault();
            var selector = this.dataset.menuToggle || ".navbar-collapse, .nav-menu-mobile, .mobile-menu-panel";
            var open = false;
            document.querySelectorAll(selector).forEach(function (target) {
              open = target.classList.toggle("show");
              target.classList.toggle("open", open);
              target.setAttribute("aria-hidden", String(!open));
            });
            this.setAttribute("aria-expanded", String(open));
          });
        });
      };
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bindMenuToggle, { once: true });
      else bindMenuToggle();
    })();
  </script>
