  <script>
  (function () {
    function ready(fn) {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', fn, { once: true });
      } else {
        fn();
      }
    }

    ready(function () {
      const userStyles = document.getElementById('user-styles');
      const userStyles2 = document.getElementById('user-styles2');
      const adminStyles = document.getElementById('admin-styles');
      const viewportMeta = document.getElementById('myViewport');

      const applyCssMode = () => {
        const isAdminRoute = /(^|\/)admin(\/|$)/i.test(window.location.pathname || '');
        if (userStyles) userStyles.disabled = isAdminRoute;
        if (userStyles2) userStyles2.disabled = isAdminRoute;
        if (adminStyles) adminStyles.disabled = !isAdminRoute;
        document.title = 'king777';
        if (viewportMeta) {
          viewportMeta.setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover');
        }
      };

      const patchHistoryMethod = (methodName) => {
        const original = history[methodName];
        if (typeof original !== 'function') return;
        history[methodName] = function () {
          const result = original.apply(this, arguments);
          requestAnimationFrame(applyCssMode);
          return result;
        };
      };

      applyCssMode();
      patchHistoryMethod('pushState');
      patchHistoryMethod('replaceState');
      window.addEventListener('popstate', applyCssMode);
      window.addEventListener('hashchange', applyCssMode);

      const THEME_KEY = 'ambani_theme';
      const DEFAULT_THEME = 'dark';
      const validThemes = ['dark', 'light', 'midnight'];

      function applyTheme(theme) {
        const mode = validThemes.includes(theme) ? theme : DEFAULT_THEME;
        document.body.setAttribute('data-theme', mode);
        try {
          localStorage.setItem(THEME_KEY, mode);
        } catch (error) {}
        document.querySelectorAll('.theme-option').forEach((button) => {
          button.classList.toggle('active', button.dataset.theme === mode);
        });
      }

      let storedTheme = DEFAULT_THEME;
      try {
        storedTheme = localStorage.getItem(THEME_KEY) || DEFAULT_THEME;
      } catch (error) {}
      applyTheme(storedTheme);

      const trigger = document.querySelector('.theme-switcher__trigger');
      const switcher = document.querySelector('.theme-switcher');
      document.querySelectorAll('.theme-option').forEach((button) => {
        button.addEventListener('click', () => {
          applyTheme(button.dataset.theme);
          if (switcher) switcher.classList.remove('open');
        });
      });
      if (trigger && switcher) {
        trigger.addEventListener('click', () => switcher.classList.toggle('open'));
      }

      const toggleButtons = document.querySelectorAll('[data-menu-toggle], .navbar-toggler, .mobile-menu-btn');
      toggleButtons.forEach((button) => {
        button.addEventListener('click', function (event) {
          event.preventDefault();
          const selector = this.dataset.menuToggle || '.navbar-collapse, .mobile-menu-panel, .nav-menu-mobile';
          const targets = Array.from(document.querySelectorAll(selector));
          const shouldOpen = !targets.some((target) => target.classList.contains('open') || target.classList.contains('show'));

          targets.forEach((target) => {
            target.classList.toggle('open', shouldOpen);
            target.classList.toggle('show', shouldOpen);
            target.classList.toggle('mobile-open', shouldOpen);
            target.setAttribute('aria-hidden', String(!shouldOpen));
          });

          this.setAttribute('aria-expanded', String(shouldOpen));
          this.classList.toggle('collapsed', !shouldOpen);
        });
      });
    });
  })();
</script>

    const ensureNeutralTheme = () => {
      let styleTag = document.getElementById('neutral-theme-override');
      if (!styleTag) {
        styleTag = document.createElement('style');
        styleTag.id = 'neutral-theme-override';
        document.head.appendChild(styleTag);
      }
      styleTag.textContent = neutralThemeCss;
    };

    const bindMenuToggle = () => {
      document.querySelectorAll('[data-menu-toggle], .navbar-toggler, .mobile-menu-btn').forEach((button) => {
        if (button.dataset.menuBound === 'true') return;
        button.dataset.menuBound = 'true';
        button.addEventListener('click', function (event) {
          event.preventDefault();
          const selector = this.dataset.menuToggle || '.navbar-collapse, .nav-menu-mobile, .mobile-menu-panel';
          document.querySelectorAll(selector).forEach((target) => {
            const isOpen = target.classList.toggle('show');
            target.classList.toggle('open', isOpen);
            target.classList.toggle('mobile-open', isOpen);
          });
          this.classList.toggle('collapsed');
        });
      });
    };

    const run = () => {
      ensureNeutralTheme();
      bindMenuToggle();
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', run, { once: true });
    } else {
      run();
    }
  })();
